[project]
name = "medical-sam2-gui"
version = "0.1.0"
description = "Interactive Napari GUI for Medical-SAM2 segmentation workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "matplotlib>=3.8.0",
    "napari[all]>=0.6.0",
    "nibabel>=5.2.1",
    "numpy<2.0",
    "opencv-python-headless>=4.9.0.80",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pydicom>=2.4.4",
    "pyqt6>=6.7.1",
    "pyvista>=0.43.0",
    "pyyaml>=6.0.1",
    "qtpy>=2.4.3",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "simpleitk>=2.3.1",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "torchvision>=0.18.0",
    "tqdm>=4.66.0",
]
