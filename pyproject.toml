[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-sam2-gui"
version = "1.1.0"
description = "Interactive Napari GUI for Medical-SAM2 segmentation workflows."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "medical_sam2_train/LICENSE", "medical_sam2_train/LICENSE_cctorch"]
authors = [
    { name = "Woojae Hong" },
    { name = "Jong Ha Hwang" },
    { name = "Jiyong Chung" },
    { name = "Joongyeon Choi" },
    { name = "Hyunggun Kim" },
    { name = "Yong Hwy Kim" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "matplotlib>=3.8.0",
    "napari>=0.6.6",
    "nibabel>=5.2.1",
    "numpy<2.0",
    "opencv-python-headless>=4.9.0.80",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pydicom>=2.4.4",
    "platformdirs>=4.2.0",
    "pyqt6>=6.7.1",
    "pyvista>=0.43.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "qtpy>=2.4.3",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "simpleitk>=2.3.1",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "torchvision>=0.18.0",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/SKKU-IBE/Medical-SAM2GUI"
Repository = "https://github.com/SKKU-IBE/Medical-SAM2GUI"
Issues = "https://github.com/SKKU-IBE/Medical-SAM2GUI/issues"

[project.scripts]
medical-sam2-gui = "medsam_gui:main"
medical-sam2-download-checkpoint = "gui.checkpoints:download_cli"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=8.3,<10",
]

[tool.setuptools]
include-package-data = true
py-modules = ["cfg", "dataloader", "medsam_gui"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conf*", "func_3d*", "gui*", "medical_sam2_train*"]
namespaces = true

[tool.setuptools.package-data]
medical_sam2_train = ["*.yaml", "LICENSE", "LICENSE_cctorch"]
